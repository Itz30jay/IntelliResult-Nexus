# ==============================================================================
# IntelliResult Nexus - local development defaults
# ==============================================================================
# Every key here can be overridden by an environment variable at deploy time.
# AppConfig.java performs the mapping: "db.url" -> "INTELLIRESULT_DB_URL"
# (dots become underscores, value is upper-cased, prefixed with INTELLIRESULT_).
#
# SECRETS ARE DELIBERATELY ABSENT FROM THIS FILE: db.password, sentry.dsn, and
# mail.password have NO default here. AppConfig throws a clear startup
# exception for db.password (the app cannot run without a database) and
# no-ops gracefully for sentry.dsn / mail.password (those integrations are
# optional and simply stay disabled until configured). See AppConfig.java.
# ==============================================================================

app.name=IntelliResult Nexus
# development | production - relaxes/tightens a small number of behaviors
# (e.g. whether Hibernate schema mismatches are tolerated). See AppConfig.
app.environment=development
app.session.timeoutMinutes=30

# ---- Security ----------------------------------------------------------
# BCrypt cost factor. 10 matches jBCrypt's own default; raise (e.g. to 12)
# to respond to faster hardware over time without a code change.
security.bcrypt.cost=10
# Comma-separated path prefixes AuthenticationFilter treats as public (no
# login required). Kept configurable rather than hardcoded so a new public
# area (e.g. Phase 12's QR verification page) is a config change, not a
# filter-code change.
security.public.paths=/,/login,/register,/forgot-password,/assets,/common,/verify

# ---- Database (MySQL 8+) ----------------------------------------------------
db.url=jdbc:mysql://localhost:3306/intelliresult_nexus?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
db.username=intelliresult_app
# db.password is intentionally unset - export INTELLIRESULT_DB_PASSWORD instead.

# validate = schema owned by Phase 2's versioned SQL scripts (production default).
# update   = let Hibernate evolve the schema from entities (local convenience
#            only, while Phase 2/3 are still being built out).
db.schema.management=update

# ---- HikariCP connection pool -----------------------------------------------
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.connectionTimeoutMs=30000
db.pool.idleTimeoutMs=600000

# ---- Sentry -------------------------------------------------------------
# sentry.dsn is intentionally unset - export INTELLIRESULT_SENTRY_DSN to
# activate error tracking. Sentry.init() is designed to no-op safely when
# no DSN is supplied, so local development works fine without one.
sentry.environment=development
sentry.tracesSampleRate=0.2

# ---- File Uploads (Phase 13) --------------------------------------------
# Sec. 65's "validate file size" - applies to both bulk-import forms
# (Student, Marks). 5MB comfortably covers a few thousand data rows of
# plain text/numbers; enforced by the servlet before ExcelUtil ever opens
# the file, not a byte more is buffered on the way to the size check.
import.excel.maxFileSizeBytes=5242880

# ---- Mail (Phase 14) ---------------------------------------------------
mail.host=smtp.example.edu
mail.port=587
mail.username=noreply@example.edu
# mail.password is intentionally unset - export INTELLIRESULT_MAIL_PASSWORD.
